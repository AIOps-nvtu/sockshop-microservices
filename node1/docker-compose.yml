services: 
  rabbitmq:
    image: rabbitmq:3.6.8
    hostname: rabbitmq
    restart: always
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.node == node-1
    cap_add:
      - NET_BIND_SERVICE
      - NET_RAW
      - NET_ADMIN
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    read_only: true
    ports:
      - "6379:6379"
        
  orders-db:
    image: mongo:3.4 
    hostname: orders-db
    restart: always
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.node == node-2
    cap_drop:
      - all
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  carts-db:
    image: mongo:3.4
    hostname: carts-db
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.node == node-3 
    restart: always
    cap_drop:
      - all
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  catalogue-db:
    image: weaveworksdemos/catalogue-db:0.3.0
    hostname: catalogue-db
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.node == node-4
    restart: always
    environment:
     - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
     - MYSQL_ALLOW_EMPTY_PASSWORD=true
     - MYSQL_DATABASE=socksdb

  catalogue:
    # image: weaveworksdemos/catalogue:0.3.5
    image: catalogue-chaosd:latest
    hostname: catalogue
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.node == node-5
    restart: always
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
      - NET_RAW
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DD_AGENT_HOST=host.docker.internal
      - DD_TRACE_AGENT_PORT=8126
      - DD_LOGS_INJECTION=true

  carts:
    image: carts-chaosd:latest
    hostname: carts
    ports:
      - "31767:31767"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DD_AGENT_HOST=host.docker.internal
      - DD_TRACE_AGENT_PORT=8126
      - DD_LOGS_INJECTION=true
      - JAVA_OPTS=-Xms64m -Xmx128m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.node == node-6
      endpoint_mode: vip # Ensure this is included
    restart: always
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE

  user-db:
    image: weaveworksdemos/user-db:0.4.0
    hostname: user-db
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.node == node-7
    restart: always
    cap_drop:
      - all
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  user:
    image: weaveworksdemos/user:0.4.4
    # image: user-chaosd:latest
    hostname: user
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.node == node-8
    restart: always
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MONGO_HOST=user-db:27017
      - DD_AGENT_HOST=host.docker.internal
      - DD_TRACE_AGENT_PORT=8126
      - DD_LOGS_INJECTION=true

  queue-master:
    image: weaveworksdemos/queue-master:0.3.1
    # image: queue-master-chaosd:latest
    hostname: queue-master
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.node == node-9
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
      - NET_RAW
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DD_AGENT_HOST=host.docker.internal
      - DD_TRACE_AGENT_PORT=8126
      - DD_LOGS_INJECTION=true

  front-end:
    image: frontend-chaosd:latest
    hostname: front-end
    # restart: always
    ports:
      - "8079:8079"
      - "31768:31767"
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
      - NET_RAW
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.node == node-10
      endpoint_mode: vip # Ensure this is included
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DD_AGENT_HOST=host.docker.internal
      - DD_TRACE_AGENT_PORT=8126
      - DD_LOGS_INJECTION=true

  edge-router:
    image: weaveworksdemos/edge-router:0.1.1
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.node == node-11
    ports:
      - '80:80'
      - '8080:8080'
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    hostname: edge-router
    restart: always

  orders:
    image: orders-chaosd:latest
    hostname: orders
    ports:
      - "31769:31767"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.node == node-12
      endpoint_mode: vip # Ensure this is included
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DD_AGENT_HOST=host.docker.internal
      - DD_TRACE_AGENT_PORT="8126"
      - DD_LOGS_INJECTION=true
      - JAVA_OPTS=-Xms64m -Xmx128m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE

  shipping:
    image: shipping-chaosd:latest
    hostname: shipping
    ports:
      - "31770:31767" # Map host port 31767 to container port 31767
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.node == node-13
      endpoint_mode: vip # Ensure this is included
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DD_AGENT_HOST=host.docker.internal
      - DD_TRACE_AGENT_PORT=8126
      - DD_LOGS_INJECTION=true
      - JAVA_OPTS=-Xms64m -Xmx128m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom -Dspring.zipkin.enabled=false
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE

  payment:
    image: payment-chaosd:latest
    #image: payment-chaosd:delay
    hostname: payment
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.node == node-14
      endpoint_mode: vip # Ensure this is included
    ports:
      - "31771:31767"
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
      - NET_RAW
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DD_AGENT_HOST=host.docker.internal
      - DD_TRACE_AGENT_PORT=8126
      - DD_LOGS_INJECTION=true
